# Hourly: rebuild assets/session.svg ("Recent work"). Contributions are fetched fresh every run (GraphQL with
# GITHUB_TOKEN). Commits and lines of code come from data/session.json, which the nightly art.yml refreshes from
# its clones; when that cache is 20 h old or more, build_session.py clones the public repos itself.
name: Recent work session

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build_session.py", "scripts/theme.py"]

permissions:
  contents: write

concurrency:
  group: data-art            # shared with art.yml: never two pushes racing
  cancel-in-progress: false  # wait for a running nightly redraw instead of cancelling it

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
          ART_WORK: ${{ runner.temp }}/art
        run: python3 -I scripts/build_session.py
      - name: Validate
        run: python3 -I -c 'import xml.dom.minidom,sys; xml.dom.minidom.parse(sys.argv[1])' assets/session.svg
      - name: Commit
        run: |
          git config user.name "profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/session.svg data/session.json README.md
          git diff --cached --quiet || { git commit -m "chore: refresh recent work" && git pull --rebase --quiet && git push; }
